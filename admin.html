<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-r from-purple-600 to-purple-700 p-8">
        <div class="max-w-6xl mx-auto">
            <div class="bg-white p-6 rounded-lg mb-6">
                <h1 class="text-3xl font-bold mb-2">📊 Admin Dashboard</h1>
                <p class="text-gray-600">View and manage all submissions</p>
            </div>

            <div class="flex gap-2 mb-6">
                <button id="projectBtn" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold">📝 Projects</button>
                <button id="firmBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">🏢 Firms</button>
            </div>

            <div id="projectsTab" class="bg-white p-6 rounded-lg mb-6">
                <h2 class="text-2xl font-bold mb-4">📝 Project Submissions</h2>
                <button id="exportProjects" class="bg-green-600 text-white px-4 py-2 rounded mb-4">📊 Export CSV</button>
                <div id="projectsTable"></div>
            </div>

            <div id="firmsTab" class="bg-white p-6 rounded-lg mb-6 hidden">
                <h2 class="text-2xl font-bold mb-4">🏢 Firm Submissions</h2>
                <button id="exportFirms" class="bg-green-600 text-white px-4 py-2 rounded mb-4">📊 Export CSV</button>
                <div id="firmsTable"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg max-w-4xl w-full max-h-96 overflow-y-auto">
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-gray-500 text-2xl mb-4">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let projectsData = [];
        let firmsData = [];

        async function loadData() {
            projectsData = await fetch('/api/admin/projects').then(r => r.json());
            firmsData = await fetch('/api/admin/firms').then(r => r.json());
            renderProjects();
            renderFirms();
        }

        function showTab(tab) {
            if (tab === 'projects') {
                document.getElementById('projectsTab').classList.remove('hidden');
                document.getElementById('firmsTab').classList.add('hidden');
            } else {
                document.getElementById('projectsTab').classList.add('hidden');
                document.getElementById('firmsTab').classList.remove('hidden');
            }
        }

        function renderProjects() {
            const html = `
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-purple-100">
                            <th class="border p-3 text-left">Project</th>
                            <th class="border p-3 text-left">Firm</th>
                            <th class="border p-3 text-left">Cost</th>
                            <th class="border p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${projectsData.map(p => `
                            <tr class="hover:bg-purple-50">
                                <td class="border p-3"><strong>${p.project_title}</strong></td>
                                <td class="border p-3">${p.implementing_firm || 'N/A'}</td>
                                <td class="border p-3">$${parseFloat(p.initial_cost).toLocaleString()}</td>
                                <td class="border p-3 text-center">
                                    <button onclick="showProjectDetail(${p.id})" class="bg-purple-600 text-white px-3 py-1 rounded text-sm">View</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('projectsTable').innerHTML = html;
        }

        function renderFirms() {
            const html = `
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-blue-100">
                            <th class="border p-3 text-left">Firm Name</th>
                            <th class="border p-3 text-left">Submitted</th>
                            <th class="border p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${firmsData.map(f => `
                            <tr class="hover:bg-blue-50">
                                <td class="border p-3"><strong>${f.firm_name}</strong></td>
                                <td class="border p-3">${new Date(f.submission_date).toLocaleDateString()}</td>
                                <td class="border p-3 text-center">
                                    <button onclick="showFirmDetail(${f.id})" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">View</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('firmsTable').innerHTML = html;
        }

        function showProjectDetail(id) {
            const p = projectsData.find(x => x.id === id);
            const parseMetrics = (json) => {
                try { return typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return {}; }
            };

            const cats = [
                { name: '💰 Cost Performance (20%)', items: ['Cost Variation', 'Unit Cost', 'Change Orders', 'Payment Compliance', 'Procurement Savings'], data: parseMetrics(p.cost_performance) },
                { name: '⏱️ Schedule Performance (20%)', items: ['Schedule Variation', 'Milestone Consistency', 'Rain Days', 'RFI Time', 'RFC Time'], data: parseMetrics(p.schedule_performance) },
                { name: '✓ Quality Performance (20%)', items: ['Defect Density', 'Material Pass Rate', 'Compliance', 'Tech Adoption', 'Rework'], data: parseMetrics(p.quality_performance) },
                { name: '👥 Local Content (25%)', items: ['Workforce', 'Skill Transfer', 'Local Material', 'Sub-contracting', 'Procurement', 'Skill Spending', 'Skill Hours', 'Skill Levels', 'Skilled Earnings', 'Semi-skilled Earnings', 'Apprenticeships'], data: parseMetrics(p.local_content_performance) },
                { name: '🛡️ Safety & Environment (15%)', items: ['Accident Rate', 'Accident Costs', 'PPE', 'Environmental', 'Sustainable Materials', 'Waste Management', 'Female Ratio', 'Youth Ratio'], data: parseMetrics(p.safety_env_performance) }
            ];

            let html = `
                <h2 class="text-2xl font-bold mb-4">${p.project_title}</h2>
                <div class="bg-purple-50 p-4 rounded-lg mb-4">
                    <p><strong>Firm:</strong> ${p.implementing_firm}</p>
                    <p><strong>Cost:</strong> $${parseFloat(p.initial_cost).toLocaleString()}</p>
                    <p><strong>Duration:</strong> ${p.duration} years</p>
                    <p><strong>Submitted:</strong> ${new Date(p.submission_date).toLocaleString()}</p>
                </div>
                <h3 class="font-bold text-lg mb-3">Performance Metrics</h3>
            `;
            
            cats.forEach(cat => {
                html += `<div class="bg-purple-50 p-3 rounded-lg mb-3"><h4 class="font-bold mb-2">${cat.name}</h4><div class="text-sm space-y-1">`;
                cat.items.forEach((item, i) => {
                    const result = cat.data[i + '_result'] || '—';
                    const source = cat.data[i + '_source'] || '';
                    html += `<p><span class="text-gray-700">${item}:</span> <strong>${result}</strong> <span class="text-xs text-gray-500">(${source})</span></p>`;
                });
                html += `</div></div>`;
            });

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function showFirmDetail(id) {
            const f = firmsData.find(x => x.id === id);
            const parseMetrics = (json) => {
                try { return typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return {}; }
            };

            const cats = [
                { name: '💰 Financial', items: ['Gross Profit', 'Net Profit', 'ROA', 'Admin Costs', 'Debt', 'Working Capital', 'Backlog'], data: parseMetrics(f.financial_performance) },
                { name: '📊 Competitiveness', items: ['Bid Success', 'Surveys', 'CapEX', 'Tax', 'H&S', 'Human Capital', 'Training', 'Female'], data: parseMetrics(f.competitiveness) },
                { name: '😊 Customer', items: ['Satisfaction', 'Acceptance', 'Complaints'], data: parseMetrics(f.customer_satisfaction) },
                { name: '🔧 Technology', items: ['Tech', 'R&D', 'Digital Skills'], data: parseMetrics(f.technology_advancement) },
                { name: '💬 Communication', items: ['Web', 'Meetings', 'Compliance'], data: parseMetrics(f.communication_framework) },
                { name: '🤝 Collaboration', items: ['Teamwork', 'CSR', 'RFI', 'Conflict'], data: parseMetrics(f.collaboration) },
                { name: '👥 Employee', items: ['Incentives', 'Pay', 'Leave', 'Welfare', 'Satisfaction'], data: parseMetrics(f.employee_satisfaction) },
                { name: '📦 Product', items: ['Certification', 'Officers', 'Marketing', 'Delivery', 'Cost'], data: parseMetrics(f.product_orientation) }
            ];

            let html = `<h2 class="text-2xl font-bold mb-4">${f.firm_name}</h2>`;
            cats.forEach(cat => {
                html += `<div class="bg-blue-50 p-3 rounded-lg mb-3"><h4 class="font-bold mb-2">${cat.name}</h4><div class="text-sm space-y-1">`;
                cat.items.forEach((item, i) => {
                    const result = cat.data[i + '_result'] || '—';
                    const source = cat.data[i + '_source'] || '';
                    html += `<p><span class="text-gray-700">${item}:</span> <strong>${result}</strong> <span class="text-xs text-gray-500">(${source})</span></p>`;
                });
                html += `</div></div>`;
            });

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function downloadCSV(type) {
            const data = type === 'projects' ? projectsData : firmsData;
            const headers = Object.keys(data[0] || {});
            let csv = headers.join(',') + "\n";
            data.forEach(row => {
                const values = headers.map(h => {
                    let v = row[h] || '';
                    if (typeof v === 'object') v = JSON.stringify(v);
                    if (String(v).includes(',') || String(v).includes('"')) {
                        v = '"' + String(v).replace(/"/g, '""') + '"';
                    }
                    return v;
                });
                csv += values.join(',') + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = type + '_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        document.getElementById('projectBtn').addEventListener('click', () => showTab('projects'));
        document.getElementById('firmBtn').addEventListener('click', () => showTab('firms'));
        document.getElementById('exportProjects').addEventListener('click', () => downloadCSV('projects'));
        document.getElementById('exportFirms').addEventListener('click', () => downloadCSV('firms'));

        loadData();
    </script>
</body>
</html>
