<!DOCTYPE html>
<html>
<head>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .error-input { border-color: #dc2626; background: #fef2f2; }
        .error-text { color: #dc2626; font-size: 12px; margin-top: 4px; }
        .draft-box { background: #dbeafe; border-left: 4px solid #3b82f6; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
        .metric-row { background: #f9fafb; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [page, setPage] = useState('auth');
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [user, setUser] = useState(null);

            useEffect(() => {
                if (token) {
                    fetch('/api/user/profile', { headers: { 'Authorization': `Bearer ${token}` } })
                        .then(r => r.json())
                        .then(d => { setUser(d); setPage('dashboard'); })
                        .catch(() => { localStorage.removeItem('token'); setToken(null); });
                }
            }, [token]);

            return (
                <div className="min-h-screen bg-gradient-to-r from-purple-600 to-purple-700 p-8">
                    <div className="max-w-4xl mx-auto">
                        {page === 'auth' && <AuthPage setToken={setToken} />}
                        {page === 'dashboard' && user && <Dashboard user={user} setPage={setPage} setToken={setToken} setUser={setUser} />}
                        {page === 'project' && token && <ProjectForm token={token} setPage={setPage} />}
                    </div>
                </div>
            );
        }

        function AuthPage({ setToken }) {
            const [mode, setMode] = useState('login');
            const [form, setForm] = useState({ email: '', password: '', username: '', country: '' });
            const [msg, setMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const url = mode === 'login' ? '/api/login' : '/api/register';
                    const body = mode === 'login' ? { email: form.email, password: form.password } : form;
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('token', data.token);
                        setToken(data.token);
                    } else {
                        setMsg('❌ ' + (data.error || 'Error'));
                    }
                } catch (e) {
                    setMsg('❌ Error');
                }
            };

            return (
                <div className="bg-white p-8 rounded-lg max-w-md mx-auto">
                    {msg && <div className="mb-4 p-3 bg-red-50 text-red-800 rounded">{msg}</div>}
                    <h1 className="text-2xl font-bold mb-6">{mode === 'login' ? 'Login' : 'Register'}</h1>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        {mode === 'register' && (
                            <>
                                <input type="text" placeholder="Username" value={form.username} onChange={(e) => setForm({...form, username: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                                <input type="text" placeholder="Country" value={form.country} onChange={(e) => setForm({...form, country: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                            </>
                        )}
                        <input type="email" placeholder="Email" value={form.email} onChange={(e) => setForm({...form, email: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-lg" required />
                        <input type="password" placeholder="Password" value={form.password} onChange={(e) => setForm({...form, password: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-lg" required />
                        <button type="submit" className="w-full bg-purple-600 text-white py-2 rounded-lg font-bold">Sign In / Register</button>
                    </form>
                    <p className="text-center mt-4"><button onClick={() => setMode(mode === 'login' ? 'register' : 'login')} className="text-purple-600 font-bold">{mode === 'login' ? 'Create Account' : 'Have Account?'}</button></p>
                </div>
            );
        }

        function Dashboard({ user, setPage, setToken, setUser }) {
            return (
                <div className="bg-white p-8 rounded-lg max-w-2xl">
                    <div className="flex justify-between mb-6">
                        <h1 className="text-2xl font-bold">Dashboard</h1>
                        <button onClick={() => { localStorage.removeItem('token'); localStorage.removeItem('projectDraftId'); localStorage.removeItem('firmDraftId'); setToken(null); setUser(null); setPage('auth'); }} className="bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
                    </div>
                    <p className="text-gray-600 mb-6">Welcome, {user.username}!</p>
                    <button onClick={() => setPage('project')} className="w-full bg-purple-600 text-white px-6 py-4 rounded-lg font-bold text-lg">📝 Project Form (7 Steps)</button>
                </div>
            );
        }

        function ProjectForm({ token, setPage }) {
            const [step, setStep] = useState(1);
            const [msg, setMsg] = useState('');
            const [draftId, setDraftId] = useState('');
            const [errors, setErrors] = useState({});
            const [data, setData] = useState({
                project_id: '', project_title: '', implementing_agency: '', funding_agency: '', implementing_firm: '', initial_cost: '', start_date: '', duration: '',
                cost_metrics: {}, schedule_metrics: {}, quality_metrics: {}, local_content_metrics: {}, safety_metrics: {}
            });

            useEffect(() => {
                // Draft auto-load disabled for testing
                // const saved = localStorage.getItem('projectDraftId');
                // if (saved) {
                //     fetch(`/api/load-project-draft/${saved}`, { headers: { 'Authorization': `Bearer ${token}` } })
                //         .then(r => r.json())
                //         .then(d => { setData(d.project_data); setDraftId(saved); setMsg('✅ Draft loaded!'); setTimeout(() => setMsg(''), 3000); })
                //         .catch(e => console.log('No draft'));
                // }
            }, [token]);

            const validateField = (field, value) => {
                if (field === 'initial_cost' || field === 'duration') {
                    if (!value) return true;
                    const str = value.toString().trim();
                    return /^[0-9.]*$/.test(str) && (str.match(/\./g) || []).length <= 1;
                }
                return true;
            };

            const validateMetrics = (cat) => {
                const metrics = data[cat];
                const errors = [];
                for (let key in metrics) {
                    if (key.includes('_result') && metrics[key]) {
                        if (!/^[0-9.]*$/.test(metrics[key])) {
                            errors.push(key);
                        }
                    }
                }
                return errors;
            };

            const canProceed = () => {
                if (step === 1) return !errors.initial_cost && !errors.duration && data.project_id && data.project_title;
                if (step === 2) return validateMetrics('cost_metrics').length === 0;
                if (step === 3) return validateMetrics('schedule_metrics').length === 0;
                if (step === 4) return validateMetrics('quality_metrics').length === 0;
                if (step === 5) return validateMetrics('local_content_metrics').length === 0;
                if (step === 6) return validateMetrics('safety_metrics').length === 0;
                return true;
            };

            const handleChange = (field, value) => {
                setData({...data, [field]: value});
                if (!validateField(field, value)) {
                    setErrors({...errors, [field]: 'Numbers only'});
                } else {
                    const newErrors = {...errors};
                    delete newErrors[field];
                    setErrors(newErrors);
                }
            };

            const handleMetricChange = (cat, key, val) => {
                setData({...data, [cat]: {...data[cat], [key]: val}});
            };

            const formatNum = (val) => {
                if (!val) return '';
                return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            };

            const saveDraft = async () => {
                const id = draftId || 'draft_' + Date.now();
                try {
                    await fetch('/api/save-project-draft', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ draft_id: id, project_data: data })
                    });
                    setDraftId(id);
                    localStorage.setItem('projectDraftId', id);
                    setMsg(`✅ Draft saved!`);
                    setTimeout(() => setPage('dashboard'), 2000);
                } catch (e) {
                    setMsg('❌ Failed');
                }
            };

            const pct = (step / 7) * 100;

            return (
                <div className="bg-white p-8 rounded-lg max-w-4xl">
                    <button onClick={() => setPage('dashboard')} className="text-gray-500 text-2xl mb-4">← Back</button>
                    {draftId && <div className="draft-box"><p><strong>📝 Draft:</strong> {draftId}</p></div>}
                    {msg && <div className="mb-4 p-3 bg-blue-50 text-blue-800 rounded">{msg}</div>}
                    
                    <h2 className="text-2xl font-bold mb-2">Part B: Project Benchmarking</h2>
                    <p className="text-gray-600 mb-4">Step {step} of 7</p>
                    <div className="bg-gray-200 h-2 rounded-full mb-6"><div className="bg-purple-600 h-2 rounded-full" style={{width: pct + '%'}}></div></div>

                    {step === 1 && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-sm font-medium">Project ID</label><input type="text" value={data.project_id} onChange={(e) => handleChange('project_id', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Project Title</label><input type="text" value={data.project_title} onChange={(e) => handleChange('project_title', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Implementing Agency</label><input type="text" value={data.implementing_agency} onChange={(e) => handleChange('implementing_agency', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Funding Agency</label><input type="text" value={data.funding_agency} onChange={(e) => handleChange('funding_agency', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Implementing Firm</label><input type="text" value={data.implementing_firm} onChange={(e) => handleChange('implementing_firm', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Initial Cost (USD)</label><input type="text" value={formatNum(data.initial_cost)} onChange={(e) => handleChange('initial_cost', e.target.value.replace(/,/g, ''))} className={`w-full px-4 py-2 border rounded-lg ${errors.initial_cost ? 'error-input' : 'border-gray-300'}`} />{errors.initial_cost && <p className="error-text">❌ {errors.initial_cost}</p>}</div>
                                <div><label className="text-sm font-medium">Start Date</label><input type="date" value={data.start_date} onChange={(e) => handleChange('start_date', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" /></div>
                                <div><label className="text-sm font-medium">Duration (years)</label><input type="text" value={data.duration} onChange={(e) => handleChange('duration', e.target.value)} className={`w-full px-4 py-2 border rounded-lg ${errors.duration ? 'error-input' : 'border-gray-300'}`} />{errors.duration && <p className="error-text">❌ {errors.duration}</p>}</div>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div>
                            <h3 className="text-lg font-bold mb-4">B.2.1 Cost Performance (20%)</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {['Cost Variation (%)', 'Unit Cost', 'Change Orders Ratio', 'Payment Compliance', 'Procurement Savings Ratio'].map((m, i) => (
                                    <div key={i} className="metric-row">
                                        <label className="block text-sm font-medium mb-2">{m}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <input type="text" placeholder="Result (numbers)" value={data.cost_metrics[`${i}_result`] || ''} onChange={(e) => handleMetricChange('cost_metrics', `${i}_result`, e.target.value)} onBlur={(e) => { if (e.target.value && !/^[0-9.]*$/.test(e.target.value)) e.target.className = 'w-full px-3 py-2 border-2 border-red-600 bg-red-50 rounded text-sm'; else e.target.className = 'w-full px-3 py-2 border border-gray-300 rounded text-sm'; }} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" />
                                                {data.cost_metrics[`${i}_result`] && !/^[0-9.]*$/.test(data.cost_metrics[`${i}_result`]) && <p className="error-text">❌ Must be a number</p>}
                                            </div>
                                            <input type="text" placeholder="Source" value={data.cost_metrics[`${i}_source`] || ''} onChange={(e) => handleMetricChange('cost_metrics', `${i}_source`, e.target.value)} className="px-3 py-2 border border-gray-300 rounded text-sm" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {step === 3 && (
                        <div>
                            <h3 className="text-lg font-bold mb-4">B.2.2 Schedule Performance (20%)</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {['Schedule Variation', 'Milestone Consistency', 'Days lost to rain', 'RFI Response Time', 'RFC Response Time'].map((m, i) => (
                                    <div key={i} className="metric-row">
                                        <label className="block text-sm font-medium mb-2">{m}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <input type="text" placeholder="Result (numbers)" value={data.schedule_metrics[`${i}_result`] || ''} onChange={(e) => handleMetricChange('schedule_metrics', `${i}_result`, e.target.value)} onBlur={(e) => { if (e.target.value && !/^[0-9.]*$/.test(e.target.value)) e.target.className = 'w-full px-3 py-2 border-2 border-red-600 bg-red-50 rounded text-sm'; else e.target.className = 'w-full px-3 py-2 border border-gray-300 rounded text-sm'; }} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" />
                                                {data.schedule_metrics[`${i}_result`] && !/^[0-9.]*$/.test(data.schedule_metrics[`${i}_result`]) && <p className="error-text">❌ Must be a number</p>}
                                            </div>
                                            <input type="text" placeholder="Source" value={data.schedule_metrics[`${i}_source`] || ''} onChange={(e) => handleMetricChange('schedule_metrics', `${i}_source`, e.target.value)} className="px-3 py-2 border border-gray-300 rounded text-sm" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {step === 4 && (
                        <div>
                            <h3 className="text-lg font-bold mb-4">B.2.3 Quality Performance (20%)</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {['Defect Density', 'Material Test Pass Rate', 'Quality Compliance', 'Technology Adoption', 'Rework Costs Ratio'].map((m, i) => (
                                    <div key={i} className="metric-row">
                                        <label className="block text-sm font-medium mb-2">{m}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <input type="text" placeholder="Result (numbers)" value={data.quality_metrics[`${i}_result`] || ''} onChange={(e) => handleMetricChange('quality_metrics', `${i}_result`, e.target.value)} onBlur={(e) => { if (e.target.value && !/^[0-9.]*$/.test(e.target.value)) e.target.className = 'w-full px-3 py-2 border-2 border-red-600 bg-red-50 rounded text-sm'; else e.target.className = 'w-full px-3 py-2 border border-gray-300 rounded text-sm'; }} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" />
                                                {data.quality_metrics[`${i}_result`] && !/^[0-9.]*$/.test(data.quality_metrics[`${i}_result`]) && <p className="error-text">❌ Must be a number</p>}
                                            </div>
                                            <input type="text" placeholder="Source" value={data.quality_metrics[`${i}_source`] || ''} onChange={(e) => handleMetricChange('quality_metrics', `${i}_source`, e.target.value)} className="px-3 py-2 border border-gray-300 rounded text-sm" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {step === 5 && (
                        <div>
                            <h3 className="text-lg font-bold mb-4">B.2.4 Local Content & Job Creation (25%)</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {['Local Workforce', 'Skill Transfer', 'Local Material', 'Sub-contracting', 'Local Procurement', 'Skill Spending', 'Skill Hours', 'Skill Levels', 'Skilled Earnings', 'Semi-skilled Earnings', 'Apprenticeships'].map((m, i) => (
                                    <div key={i} className="metric-row">
                                        <label className="block text-sm font-medium mb-2">{m}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <input type="text" placeholder="Result (numbers)" value={data.local_content_metrics[`${i}_result`] || ''} onChange={(e) => handleMetricChange('local_content_metrics', `${i}_result`, e.target.value)} onBlur={(e) => { if (e.target.value && !/^[0-9.]*$/.test(e.target.value)) e.target.className = 'w-full px-3 py-2 border-2 border-red-600 bg-red-50 rounded text-sm'; else e.target.className = 'w-full px-3 py-2 border border-gray-300 rounded text-sm'; }} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" />
                                                {data.local_content_metrics[`${i}_result`] && !/^[0-9.]*$/.test(data.local_content_metrics[`${i}_result`]) && <p className="error-text">❌ Must be a number</p>}
                                            </div>
                                            <input type="text" placeholder="Source" value={data.local_content_metrics[`${i}_source`] || ''} onChange={(e) => handleMetricChange('local_content_metrics', `${i}_source`, e.target.value)} className="px-3 py-2 border border-gray-300 rounded text-sm" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {step === 6 && (
                        <div>
                            <h3 className="text-lg font-bold mb-4">B.2.5 Safety & Environmental (15%)</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {['Accident Rate', 'Accident Costs', 'PPE', 'Environmental', 'Sustainable Materials', 'Waste Management', 'Female Ratio', 'Youth Ratio'].map((m, i) => (
                                    <div key={i} className="metric-row">
                                        <label className="block text-sm font-medium mb-2">{m}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <input type="text" placeholder="Result (numbers)" value={data.safety_metrics[`${i}_result`] || ''} onChange={(e) => handleMetricChange('safety_metrics', `${i}_result`, e.target.value)} onBlur={(e) => { if (e.target.value && !/^[0-9.]*$/.test(e.target.value)) e.target.className = 'w-full px-3 py-2 border-2 border-red-600 bg-red-50 rounded text-sm'; else e.target.className = 'w-full px-3 py-2 border border-gray-300 rounded text-sm'; }} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" />
                                                {data.safety_metrics[`${i}_result`] && !/^[0-9.]*$/.test(data.safety_metrics[`${i}_result`]) && <p className="error-text">❌ Must be a number</p>}
                                            </div>
                                            <input type="text" placeholder="Source" value={data.safety_metrics[`${i}_source`] || ''} onChange={(e) => handleMetricChange('safety_metrics', `${i}_source`, e.target.value)} className="px-3 py-2 border border-gray-300 rounded text-sm" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {step === 7 && (
                        <div className="p-4 bg-green-50 border-l-4 border-green-500">
                            <p className="text-green-800"><strong>✅ All sections complete!</strong></p>
                        </div>
                    )}

                    <div className="flex gap-2 mt-8">
                        <button onClick={() => { if (step > 1) setStep(step - 1); else setPage('dashboard'); }} className="flex-1 bg-gray-300 text-gray-800 px-4 py-3 rounded-lg font-bold">← Back</button>
                        <button onClick={saveDraft} className="flex-1 bg-blue-500 text-white px-4 py-3 rounded-lg font-bold">💾 Save</button>
                        {step < 7 && <button onClick={() => { if (!canProceed()) { setMsg('❌ Please fill all required fields with valid numbers'); } else { setStep(step + 1); setMsg(''); } }} className={`flex-1 px-4 py-3 rounded-lg font-bold text-white ${canProceed() ? 'bg-purple-600 cursor-pointer' : 'bg-gray-400 cursor-not-allowed'}`}>Next →</button>}
                        {step === 7 && <button onClick={async () => {
                        const submitData = {
                            ...data,
                            cost_performance: data.cost_metrics,
                            schedule_performance: data.schedule_metrics,
                            quality_performance: data.quality_metrics,
                            local_content_performance: data.local_content_metrics,
                            safety_env_performance: data.safety_metrics
                        };
                        console.log('Submit clicked!');
                        console.log('Data to submit:', JSON.stringify(submitData, null, 2));
                        try {
                            const res = await fetch('/api/submit-project', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(submitData)
                            });
                            if (res.ok) {
                                localStorage.removeItem('projectDraftId');
                                setMsg('✅ Project submitted successfully!');
                                setTimeout(() => setPage('dashboard'), 3500);
                            } else {
                                setMsg('❌ Submission failed');
                            }
                        } catch (e) {
                            setMsg('❌ Error: ' + e.message);
                        }
                    }} className="flex-1 bg-green-600 text-white px-4 py-3 rounded-lg font-bold">✅ Submit</button>}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
