<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Gateway Benchmarking Tool</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .form-container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .success-message { animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { border-left: 4px solid #667eea; padding-left: 12px; }
        input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, textarea { transition: border-color 0.3s; }
        input[type="text"]:focus, input[type="email"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        function BenchmarkingTool() {
            const [currentStep, setCurrentStep] = useState('intro');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [draftIdInput, setDraftIdInput] = useState('');
            const [currentDraftId, setCurrentDraftId] = useState('');
            const API_URL = window.location.origin;
            const [projectData, setProjectData] = useState({
                project_id: '',
                project_title: '',
                implementing_agency: '',
                funding_agency: '',
                implementing_firm: '',
                initial_cost: '',
                start_date: '',
                duration: '',
                cost_performance: {},
                schedule_performance: {},
                quality_performance: {},
                local_content_performance: {},
                safety_env_performance: {}
            });
            const [firmData, setFirmData] = useState({
                firm_name: '',
                financial_performance: {},
                competitiveness: {},
                customer_satisfaction: {},
                technology_advancement: {},
                communication_framework: {},
                collaboration: {},
                employee_satisfaction: {},
                product_orientation: {}
            });
            const generateDraftId = () => 'draft_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const saveDraft = async (type) => {
                const draftId = currentDraftId || generateDraftId();
                setCurrentDraftId(draftId);
                setLoading(true);
                try {
                    const endpoint = type === 'project' ? '/api/save-project-draft' : '/api/save-firm-draft';
                    const data = type === 'project' ? { draft_id: draftId, project_data: projectData } : { draft_id: draftId, firm_data: firmData };
                    const response = await fetch(`${API_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        setMessage(`✅ Draft saved! ID: ${draftId}\n\n📋 COPY THIS ID TO LOAD LATER`);
                        setTimeout(() => setMessage(''), 8000);
                    }
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
                setLoading(false);
            };
            const loadDraft = async (type) => {
                if (!draftIdInput.trim()) { setMessage('Enter draft ID'); return; }
                setLoading(true);
                try {
                    const endpoint = type === 'project' ? `/api/load-project-draft/${draftIdInput}` : `/api/load-firm-draft/${draftIdInput}`;
                    const response = await fetch(`${API_URL}${endpoint}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (type === 'project') {
                            setProjectData(data.project_data);
                            setCurrentStep('project-profile');
                        } else {
                            setFirmData(data.firm_data);
                            setCurrentStep('firm-profile');
                        }
                        setCurrentDraftId(draftIdInput);
                        setMessage(`✅ Draft loaded!`);
                        setTimeout(() => setMessage(''), 3000);
                    } else {
                        setMessage('Draft not found');
                    }
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
                setLoading(false);
            };
            const handleProjectChange = (field, value) => {
                setProjectData(prev => ({ ...prev, [field]: value }));
            };
            const handlePerfChange = (category, idx, field, value) => {
                setProjectData(prev => ({
                    ...prev,
                    [category]: { ...prev[category], [idx]: { ...prev[category][idx], [field]: value } }
                }));
            };
            const handleFirmChange = (field, value) => {
                setFirmData(prev => ({ ...prev, [field]: value }));
            };
            const submitProject = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/api/submit-project`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(projectData)
                    });
                    if (response.ok) {
                        setMessage('✅ Submitted successfully!');
                        setCurrentStep('success');
                        setTimeout(() => {
                            setCurrentStep('intro');
                            setProjectData({
                                project_id: '', project_title: '', implementing_agency: '', funding_agency: '',
                                implementing_firm: '', initial_cost: '', start_date: '', duration: '',
                                cost_performance: {}, schedule_performance: {}, quality_performance: {},
                                local_content_performance: {}, safety_env_performance: {}
                            });
                            setCurrentDraftId('');
                        }, 2000);
                    }
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
                setLoading(false);
            };
            const submitFirm = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/api/submit-firm`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(firmData)
                    });
                    if (response.ok) {
                        setMessage('✅ Submitted successfully!');
                        setCurrentStep('success');
                        setTimeout(() => {
                            setCurrentStep('intro');
                            setFirmData({
                                firm_name: '', financial_performance: {}, competitiveness: {},
                                customer_satisfaction: {}, technology_advancement: {},
                                communication_framework: {}, collaboration: {},
                                employee_satisfaction: {}, product_orientation: {}
                            });
                            setCurrentDraftId('');
                        }, 2000);
                    }
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
                setLoading(false);
            };
            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center text-white mb-8">
                            <h1 className="text-4xl font-bold mb-2">Global Gateway Benchmarking Tool</h1>
                            <p className="text-lg opacity-90">Job Creation & Competitiveness Study - Uganda Local Construction Industry</p>
                        </div>
                        {message && (
                            <div className="mb-6">
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                                    <p className="text-blue-800 text-center font-semibold whitespace-pre-wrap">{message}</p>
                                </div>
                            </div>
                        )}
                        {currentStep === 'intro' && (
                            <div className="form-container p-8 mb-6">
                                <h2 className="text-3xl font-bold text-gray-800 mb-6">Welcome</h2>
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded">
                                    <p className="text-gray-700">This tool collects benchmarking data on Local Construction Industry projects and firms.</p>
                                    <p className="text-gray-700 mt-4"><strong>💾 Save Your Work:</strong> Save anytime and return later!</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <button onClick={() => setCurrentStep('project-profile')} className="bg-gradient-to-r from-purple-600 to-purple-700 text-white font-bold py-3 px-6 rounded-lg">📊 Project Level (Part B)</button>
                                    <button onClick={() => setCurrentStep('firm-profile')} className="bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-6 rounded-lg">🏢 Firm/Contractor (Part C)</button>
                                </div>
                                <div className="bg-green-50 border-l-4 border-green-500 p-6 rounded">
                                    <h3 className="text-lg font-bold text-green-800 mb-4">📂 Load Draft</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <input type="text" value={draftIdInput} onChange={(e) => setDraftIdInput(e.target.value)} placeholder="Paste draft ID" className="px-4 py-2 border border-green-300 rounded-lg"/>
                                        <button onClick={() => loadDraft('project')} className="bg-green-600 text-white font-bold py-2 rounded-lg">Load Project</button>
                                        <button onClick={() => loadDraft('firm')} className="bg-green-600 text-white font-bold py-2 rounded-lg">Load Firm</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentStep === 'project-profile' && (
                            <div className="form-container p-8">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Part B: Project Benchmarking</h2>
                                {currentDraftId && <div className="bg-blue-50 border-l-4 border-blue-500 p-3 mb-4 rounded"><p className="text-blue-700 text-sm"><strong>Draft:</strong> {currentDraftId}</p></div>}
                                <div className="mb-8">
                                    <h3 className="text-xl font-bold text-gray-800 section-title mb-4">B.1 Project Profile</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Project ID</label><input type="text" value={projectData.project_id} onChange={(e) => handleProjectChange('project_id', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter Project ID"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Project Title</label><input type="text" value={projectData.project_title} onChange={(e) => handleProjectChange('project_title', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter Title"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Implementing Agency/MDA</label><input type="text" value={projectData.implementing_agency} onChange={(e) => handleProjectChange('implementing_agency', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Funding Agency</label><input type="text" value={projectData.funding_agency} onChange={(e) => handleProjectChange('funding_agency', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Implementing Firm/Contractor</label><input type="text" value={projectData.implementing_firm} onChange={(e) => handleProjectChange('implementing_firm', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Initial Project Cost (USD)</label><input type="number" value={projectData.initial_cost} onChange={(e) => handleProjectChange('initial_cost', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Project Start Date</label><input type="date" value={projectData.start_date} onChange={(e) => handleProjectChange('start_date', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-2">Project Duration (years)</label><input type="number" step="0.1" value={projectData.duration} onChange={(e) => handleProjectChange('duration', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg"/></div>
                                    </div>
                                </div>
                                <PerfSection projectData={projectData} handlePerfChange={handlePerfChange}/>
                                <div className="flex gap-4 mt-8 flex-wrap">
                                    <button onClick={() => setCurrentStep('intro')} className="flex-1 min-w-[100px] bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg">← Back</button>
                                    <button onClick={() => saveDraft('project')} className="flex-1 min-w-[130px] bg-blue-500 text-white font-bold py-3 px-6 rounded-lg">{loading ? 'Saving...' : '💾 Save Draft'}</button>
                                    <button onClick={submitProject} className="flex-1 min-w-[160px] bg-gradient-to-r from-purple-600 to-purple-700 text-white font-bold py-3 px-6 rounded-lg">{loading ? 'Submitting...' : '✓ Submit'}</button>
                                </div>
                            </div>
                        )}
                        {currentStep === 'firm-profile' && (
                            <div className="form-container p-8">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Part C: Firm/Contractor Benchmarking</h2>
                                {currentDraftId && <div className="bg-blue-50 border-l-4 border-blue-500 p-3 mb-4 rounded"><p className="text-blue-700 text-sm"><strong>Draft:</strong> {currentDraftId}</p></div>}
                                <div className="mb-6"><label className="block text-sm font-medium text-gray-700 mb-2">Firm/Contractor Name</label><input type="text" value={firmData.firm_name} onChange={(e) => handleFirmChange('firm_name', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter Firm Name"/></div>
                                <FirmSection firmData={firmData} handleFirmChange={handleFirmChange}/>
                                <div className="flex gap-4 mt-8 flex-wrap">
                                    <button onClick={() => setCurrentStep('intro')} className="flex-1 min-w-[100px] bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg">← Back</button>
                                    <button onClick={() => saveDraft('firm')} className="flex-1 min-w-[130px] bg-blue-500 text-white font-bold py-3 px-6 rounded-lg">{loading ? 'Saving...' : '💾 Save Draft'}</button>
                                    <button onClick={submitFirm} className="flex-1 min-w-[160px] bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-6 rounded-lg">{loading ? 'Submitting...' : '✓ Submit'}</button>
                                </div>
                            </div>
                        )}
                        {currentStep === 'success' && (
                            <div className="form-container p-12 text-center">
                                <div className="text-6xl mb-4">✅</div>
                                <h2 className="text-3xl font-bold text-green-600 mb-4">Success!</h2>
                                <p className="text-gray-600 text-lg mb-8">Data saved securely. Thank you!</p>
                                <button onClick={() => setCurrentStep('intro')} className="bg-gradient-to-r from-green-600 to-green-700 text-white font-bold py-3 px-8 rounded-lg">Submit Another</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        function PerfSection({ projectData, handlePerfChange }) {
            const cats = [
                { id: 'cost_performance', name: 'Cost Performance', weight: '20%', metrics: ['Cost Variation', 'Unit Cost', 'Change Orders', 'Payment Compliance', 'Procurement Savings'] },
                { id: 'schedule_performance', name: 'Schedule Performance', weight: '20%', metrics: ['Schedule Variation', 'Milestone Consistency', 'Days Lost', 'RFI Response', 'RFC Response'] },
                { id: 'quality_performance', name: 'Quality Performance', weight: '20%', metrics: ['Defect Density', 'Test Pass Rate', 'Quality Compliance', 'Tech Adoption', 'Rework Costs'] },
                { id: 'local_content_performance', name: 'Local Content & Jobs', weight: '25%', metrics: ['Local Workforce', 'Skill Transfer', 'Local Materials', 'Sub-contracting', 'Skill Spending', 'Skill Hours', 'Skill Levels', 'Local Procurement', 'Avg Earnings', 'Apprenticeships'] },
                { id: 'safety_env_performance', name: 'Safety & Environment', weight: '15%', metrics: ['Accidents', 'Accident Costs', 'PPE', 'Env Compliance', 'Sustainable Materials', 'Waste %', 'Female %', 'Youth %'] }
            ];
            return (
                <div className="mb-8">
                    <h3 className="text-xl font-bold text-gray-800 section-title mb-6">B.2 Performance Metrics</h3>
                    {cats.map((cat) => (
                        <div key={cat.id} className="mb-8 bg-gray-50 p-6 rounded-lg">
                            <div className="flex justify-between items-center mb-4">
                                <h4 className="text-lg font-bold text-gray-800">{cat.name}</h4>
                                <span className="bg-purple-100 text-purple-800 px-3 py-1 rounded text-sm">{cat.weight}</span>
                            </div>
                            {cat.metrics.map((metric, idx) => (
                                <div key={idx} className="mb-4 bg-white p-4 rounded border border-gray-200">
                                    <h5 className="font-semibold text-gray-700 mb-2">{metric}</h5>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div><label className="text-xs text-gray-600">Assessment</label><input type="text" onChange={(e) => handlePerfChange(cat.id, idx, 'result', e.target.value)} value={projectData[cat.id]?.[idx]?.result || ''} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" placeholder="Value"/></div>
                                        <div><label className="text-xs text-gray-600">Source</label><input type="text" onChange={(e) => handlePerfChange(cat.id, idx, 'source', e.target.value)} value={projectData[cat.id]?.[idx]?.source || ''} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" placeholder="Source"/></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );
        }
        function FirmSection({ firmData, handleFirmChange }) {
            const cats = [
                { id: 'financial_performance', name: 'Financial', weight: '15%', metrics: ['Gross Margin', 'Net Margin', 'ROA', 'Admin Costs', 'Debt Ratio', 'Working Capital', 'Backlog Profit'] },
                { id: 'competitiveness', name: 'Competitiveness', weight: '25%', metrics: ['Bid Rate', 'Market Survey', 'CapEX', 'Tax Compliance', 'Safety', 'Qualifications', 'Training', 'Female %'] },
                { id: 'customer_satisfaction', name: 'Customer', weight: '10%', metrics: ['Satisfaction', 'Acceptance', 'Complaints'] },
                { id: 'technology_advancement', name: 'Technology', weight: '10%', metrics: ['Investment', 'R&D', 'Digital Skills'] },
                { id: 'communication_framework', name: 'Communication', weight: '10%', metrics: ['Web-based', 'Meetings', 'Compliance'] },
                { id: 'collaboration', name: 'Collaboration', weight: '10%', metrics: ['Teamwork', 'CSR', 'RFI Time', 'Conflict Resolution'] },
                { id: 'employee_satisfaction', name: 'Employee', weight: '10%', metrics: ['Incentives', 'Compensation', 'Leave', 'Welfare'] },
                { id: 'product_orientation', name: 'Product', weight: '10%', metrics: ['Certification', 'Officers', 'Marketing', 'Delivery', 'Cost'] }
            ];
            return (
                <div>
                    <h3 className="text-xl font-bold text-gray-800 section-title mb-6">C.1 Performance</h3>
                    {cats.map((cat) => (
                        <div key={cat.id} className="mb-8 bg-gray-50 p-6 rounded-lg">
                            <div className="flex justify-between items-center mb-4">
                                <h4 className="text-lg font-bold text-gray-800">{cat.name}</h4>
                                <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm">{cat.weight}</span>
                            </div>
                            {cat.metrics.map((metric, idx) => (
                                <div key={idx} className="mb-4 bg-white p-4 rounded border border-gray-200">
                                    <h5 className="font-semibold text-gray-700 mb-2">{metric}</h5>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div><label className="text-xs text-gray-600">Assessment</label><input type="text" onChange={(e) => { const newFirm = { ...firmData, [cat.id]: { ...firmData[cat.id], [idx]: { ...firmData[cat.id]?.[idx], result: e.target.value } } }; handleFirmChange(cat.id, newFirm); }} value={firmData[cat.id]?.[idx]?.result || ''} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" placeholder="Value"/></div>
                                        <div><label className="text-xs text-gray-600">Source</label><input type="text" onChange={(e) => { const newFirm = { ...firmData, [cat.id]: { ...firmData[cat.id], [idx]: { ...firmData[cat.id]?.[idx], source: e.target.value } } }; handleFirmChange(cat.id, newFirm); }} value={firmData[cat.id]?.[idx]?.source || ''} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" placeholder="Source"/></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );
        }
        ReactDOM.render(<BenchmarkingTool />, document.getElementById('root'));
    </script>
</body>
</html>
